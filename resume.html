<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mowmita Akter Nipu — Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: #f3f4f6;
        }

        .resume-container {
            width: 100%;
            height: 100%;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback {
            padding: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .fallback a {
            color: #004f90;
        }
    </style>
</head>

<body>
    <div class="resume-container">
        <iframe
            src="/resume.pdf"
            title="Mowmita Akter Nipu Resume"
        >
            <div class="fallback">
                Your browser cannot display the PDF.

                <a href="/resume.pdf">
                    Download the resume
                </a>
            </div>
        </iframe>
    </div>
</body>
</html>
