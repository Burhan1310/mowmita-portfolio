    <style>
        /* Navbar underline effect */
        .nav-underline {
            position: relative;
            display: inline-block;
        }

        .nav-underline.active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px;
            height: 3px;
            background: linear-gradient(90deg, #e11d48 60%, #fbbf24 100%);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(.4, 0, .2, 1);
        }

        .nav-underline::after {
            content: '';
            position: absolute;
            left: 50%;
            right: 50%;
            bottom: -4px;
            height: 3px;
            background: transparent;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(.4, 0, .2, 1);
        }

        @media (max-width: 991.98px) {

            .nav-underline,
            .nav-underline.active {
                display: inline-block;
            }

            .nav-underline.active::after {
                left: 0;
                right: auto;
                width: 100%;
                min-width: 0;
                max-width: 100%;
            }

            .nav-underline::after {
                left: 50%;
                right: auto;
                width: 0;
            }
        }

        @media (max-width: 575.98px) {

            .nav-underline,
            .nav-underline.active {
                display: inline-block;
            }

            .nav-underline.active::after {
                left: 0;
                right: auto;
                width: 100%;
                min-width: 0;
                max-width: 100%;
            }

            .nav-underline::after {
                left: 50%;
                right: auto;
                width: 0;
            }
        }
    </style>

        <style>
            /* Glass Effect */
            .nav-scrolled {
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            #navbar { background: transparent; }
        
            /* Nav Underline Animation */
            .nav-underline { position: relative; display: inline-block; }
            
            .nav-underline::after {
                content: ''; position: absolute; width: 0; height: 3px; bottom: -4px; left: 0; right: 0;
                background: linear-gradient(90deg, #ec4899, #eab308); /* Pink to Yellow */
                transition: width 0.3s ease;
                margin: 0 auto;
            }
        
            /* Hover State */
            .nav-underline:hover::after { width: 100%; }
        
            /* Active State (For Scroll Spy) - This is what was missing */
            .nav-underline.active { color: #ffffff !important; }
            .nav-underline.active::after { width: 100%; }
        </style>
        
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const navbar = document.getElementById('navbar');
                const mobileBtn = document.getElementById('mobile-menu-button');
                const mobileMenu = document.getElementById('mobile-menu');
                
                // 1. Navbar Background Change on Scroll
                window.addEventListener('scroll', function() {
                    if (window.scrollY > 50) {
                        navbar.classList.add('nav-scrolled');
                    } else {
                        navbar.classList.remove('nav-scrolled');
                    }
                });
        
                // 2. Mobile Menu Logic
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });
                
                mobileMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                    });
                });

                // Close mobile menu when clicking outside
                document.addEventListener('click', (event) => {
                    if (!mobileBtn.contains(event.target) && !mobileMenu.contains(event.target) && !mobileMenu.classList.contains('hidden')) {
                        mobileMenu.classList.add('hidden');
                    }
                });
            });
        </script>
